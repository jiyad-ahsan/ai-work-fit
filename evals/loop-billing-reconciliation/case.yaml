schema_version: "1.1"
name: loop-billing-reconciliation
expected_outcome: |
  Verifiable work with a strong check: the cause differs every time, but the investigation is right
  when the explained differences sum exactly to the gap. The build is an agent loop against that
  reconciliation, with guardrails, and a person who owns the check and gets the escalation when a
  project cannot be explained. The response does not talk the user out of the agent.
