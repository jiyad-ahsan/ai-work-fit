schema_version: "1.1"
name: weak-check-reply-rate-agent
expected_outcome: |
  The response does not simply label this verifiable and recommend a loop. It tests whether the check
  is good enough: reply rate is noisy and slow at that volume, and it can be gamed by emails that draw
  more replies without producing more real sales conversations. It recommends not looping, and instead
  a graph or human-approved experiments, or building a better check first.
