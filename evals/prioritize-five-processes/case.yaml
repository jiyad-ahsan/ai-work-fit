name: prioritize-five-processes
expected_outcome: |
  The response ranks the candidates and does not rank by type alone. High-volume items such as invoice
  matching and complaint triage rank above the quarterly filing and the annual supplier decision. The
  annual supplier terms decision is judgment and not a build candidate. The ranking carries a Priority
  column and names an assumption or number that would change it.
